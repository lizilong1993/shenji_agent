# I06 步骤 5：奖励消融配置
# 关闭不当行为惩罚（权重置 0），其余同全开
#
# 用法（需引擎鉴权可用）：
#   python3 -m training.selfplay --config configs/reward_ablation/reward_no_penalty.yaml
#
# ⚠ 本环境 .engine_config 鉴权不通过，故这 4 组**尚未实际跑过**，
#   仅作为配置就位；判据 2（≥3 组消融对比报告）**未达成**。

reward_shaping:
  enabled: true
  gamma: 0.99
# 惩罚总开关：0 = 全部惩罚项置 0（用于「无惩罚」组）
  penalty_scale: 0.0
