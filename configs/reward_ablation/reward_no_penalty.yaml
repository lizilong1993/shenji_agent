# I06 步骤 5：奖励消融配置
# 关闭不当行为惩罚（权重置 0），其余同全开
#
# 执行（**不需要引擎鉴权** —— 第 49/52 轮实测：鉴权失败不阻塞本地推演）：
#   python3 scripts/run_reward_ablation.py
# 注：本配置**必须由 scripts/run_reward_ablation.py 读取**才有效。
#     仅跑 `training.selfplay --config <本文件>` 是**无效**的 ——
#     selfplay.py 里没有任何 `reward_shaping` 处理（实测 0 处引用），
#     那样只会重跑一遍同样的实验，不构成消融。
reward_shaping:
  enabled: true
  gamma: 0.99
# 惩罚总开关：0 = 全部惩罚项置 0（用于「无惩罚」组）
  penalty_scale: 0.0
