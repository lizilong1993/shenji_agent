<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TW2 推演控制台（测试端）</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f4f6f8; color: #1f2933; }
  header { background: #fff; border-bottom: 1px solid #d9e0e6; padding: 14px 20px;
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .badge { font-size: 12px; color: #1f6feb; background: #e8f1ff;
                  border: 1px solid #c9dcff; border-radius: 999px; padding: 2px 9px; }
  main { padding: 16px 20px 40px; }
  .panel { background: #fff; border: 1px solid #d9e0e6; border-radius: 8px;
           padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #52606d; }
  input, select { padding: 6px 8px; border: 1px solid #cbd5df; border-radius: 5px;
                  font: inherit; background: #fff; }
  input[type=number] { width: 90px; }
  button { padding: 7px 14px; border: 1px solid #1f6feb; border-radius: 5px;
           background: #1f6feb; color: #fff; cursor: pointer; font: inherit; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: #fff; color: #1f6feb; }
  button.danger { background: #fff; color: #b42318; border-color: #e6b8b3; }
  .hint { color: #6b7785; font-size: 12px; }
  .status { margin-left: auto; font-size: 12px; color: #52606d; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eef2f5; vertical-align: top; }
  th { color: #52606d; font-weight: 600; font-size: 12px; white-space: nowrap; }
  tr:hover td { background: #fafcff; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
          margin-right: 3px; border: 1px solid #cbd5df; color: #52606d; background: #f7f9fb; }
  .pill.latest { border-color: #b7d3ff; background: #eef5ff; color: #1f6feb; }
  .pill.best { border-color: #b7e1c4; background: #eefaf2; color: #137a3d; }
  .pill.pinned { border-color: #f0d49b; background: #fff8e8; color: #8a5a00; }
  .ok { color: #137a3d; } .bad { color: #b42318; } .warn { color: #8a5a00; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; }
  .actions button { padding: 4px 8px; font-size: 12px; }
  code { font-size: 12px; color: #52606d; }
  .task-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
              padding: 6px 0; border-bottom: 1px dashed #eef2f5; }
  .task-row input { padding: 4px 6px; font-size: 12px; }
  .task-row select { padding: 4px 6px; font-size: 12px; }
  .task-row .units { width: 150px; }
  .task-row .obj { width: 150px; }
  .task-row .coord { width: 105px; }
  .task-row .when { width: 70px; }
  .gap { border: 1px solid #e6b8b3; background: #fff7f6; border-radius: 6px;
         padding: 8px 10px; margin: 6px 0; }
  #resolver { display: none; }
</style>
</head>
<body>
<header>
  <h1>TW2 推演控制台</h1>
  <span class="badge">测试端 · 真实推演</span>
  <span class="hint">发起推演会占用一个 CPU 进程；1440 tick 约 7 分钟。</span>
</header>
<main>
  <section class="panel">
    <div class="row">
      <label>案例 <select id="case"></select></label>
      <label>随机种子 <input id="seed" type="number" value="20261023" step="1"></label>
      <label>推演时长（tick） <input id="ticks" type="number" value="1440" min="10" max="2000" step="10"></label>
      <label>想定日期 <input id="scenario-date" type="datetime-local"></label>
      <label>资源模式
        <select id="resource-mode">
          <option value="auto" selected>auto（在线优先，失败回退缓存）</option>
          <option value="offline">offline（只用缓存）</option>
          <option value="online">online（要求在线刷新）</option>
        </select>
      </label>
      <label>指挥方
        <select id="side"><option value="0" selected>红方</option><option value="1">蓝方</option></select>
      </label>
      <button id="launch">发起推演</button>
      <span class="status" id="status"></span>
    </div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:6px">
      <strong>开局任务（可选）</strong>
      <span class="hint">按单位覆盖同侧默认任务；不填则执行案例内置 doctrine。单位 ID 用逗号分隔。</span>
      <button class="ghost" id="add-task" style="margin-left:auto">添加任务</button>
      <label>任务模式
        <select id="task-mode">
          <option value="user" selected>user（覆盖所涉单位）</option>
          <option value="mixed">mixed（保留默认，冲突报错）</option>
        </select>
      </label>
    </div>
    <div id="task-list"><div class="hint" id="task-empty">尚未添加任务。</div></div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:8px">
      <strong>运行结果</strong>
      <span class="hint">保留三槽位：本次（自动）/ 最优（可发布）/ 指定保留；未占槽位的旧运行会被清理。</span>
      <button class="ghost" id="refresh" style="margin-left:auto">刷新</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>运行</th><th>状态</th><th>seed</th><th>资源</th><th>事件</th><th>开火</th><th>毁伤</th>
          <th>损失</th><th>校验</th><th>角色</th><th>操作</th>
        </tr></thead>
        <tbody id="runs"><tr><td colspan="11" class="hint">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="resolver">
    <div class="row" style="margin-bottom:6px">
      <strong>处理运行资源缺口</strong>
      <span class="hint" id="resolver-run"></span>
      <button class="ghost" id="resolver-close" style="margin-left:auto">关闭</button>
    </div>
    <div id="resolver-info"></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="resolver-fetch">在线刷新</button>
      <button class="ghost" id="resolver-provide">提供环境包路径…</button>
      <button class="danger" id="resolver-cancel">取消运行</button>
      <span class="status" id="resolver-status"></span>
    </div>
  </section>
</main>
<script src="./src/simConsole.js"></script>
</body>
</html>
