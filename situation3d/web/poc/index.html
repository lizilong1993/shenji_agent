<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:#e9eef5}
  .wrap{padding:14px}
  h3{margin:0 0 8px;font-size:14px}
  .row{display:flex;gap:22px;align-items:flex-end;margin-bottom:16px;
       background:#b9d4e8;padding:12px 16px;border-radius:6px}
  .cell{text-align:center}
  .cell img{display:block;margin:0 auto;image-rendering:auto}
  .cap{font-size:11px;color:#334;margin-top:5px}
  .big img{width:132px;height:132px}
  .real img{width:40px;height:40px}
</style></head><body><div class="wrap">
  <h3>目标军标：现有（2525 帧形 + game-icons 图标） vs 剪影（不套帧，仅用颜色表阵营）</h3>
  <div class="row">
    <div class="cell big"><img src="/assets/symbols/destroyer_red.svg"><div class="cap">现有 · 放大</div></div>
    <div class="cell big"><img src="/poc/destroyer_silhouette.svg"><div class="cap">剪影 · 放大</div></div>
    <div class="cell real"><img src="/assets/symbols/destroyer_red.svg"><div class="cap">现有 · 40px<br>（实际billboard尺寸）</div></div>
    <div class="cell real"><img src="/poc/destroyer_silhouette.svg"><div class="cap">剪影 · 40px<br>（实际billboard尺寸）</div></div>
  </div>
  <h3>放到深色底上（看白色描边是否够用）</h3>
  <div class="row" style="background:#2b3a4a">
    <div class="cell real"><img src="/assets/symbols/destroyer_red.svg"></div>
    <div class="cell real"><img src="/poc/destroyer_silhouette.svg"></div>
  </div>
</div></body></html>
