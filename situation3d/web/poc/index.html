<!doctype html><html><head><meta charset="utf-8"><style>
 body{margin:0;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:#eef2f7}
 .wrap{padding:14px}
 h3{margin:0 0 4px;font-size:14px}
 .sub{color:#556;font-size:11px;margin-bottom:10px}
 .grid{display:flex;flex-wrap:wrap;gap:10px}
 .card{background:#c3d8ea;border-radius:6px;padding:8px 10px;text-align:center;width:176px}
 .card.dark{background:#2b3a4a;color:#dde}
 .big{height:120px;display:flex;align-items:center;justify-content:center}
 .big img{max-height:112px;max-width:164px}
 .px{height:46px;display:flex;align-items:center;justify-content:center;margin-top:4px}
 .px img{width:40px;height:40px}
 .cap{font-size:11px;color:#223;margin-top:3px}
 .card.dark .cap{color:#bcd}
 .row2{display:flex;gap:10px;margin-top:14px}
</style></head><body><div class="wrap">
 <h3>目标军标：10 类剪影（不套帧，仅用颜色表阵营）</h3>
 <div class="sub">每类按<b>真实尺寸比例</b>生成（见 DIMENSIONS.md）。上排为放大版，下排为 <b>40px 实际 billboard 尺寸</b>。</div>
 <div class="grid">
  <div class="card"><div class="big"><img src="/poc/destroyer_silhouette.svg"></div>
    <div class="px"><img src="/poc/destroyer_silhouette.svg"></div>
    <div class="cap">驱逐舰<br><span style="color:#667">destroyer</span></div></div>
  <div class="card"><div class="big"><img src="/poc/frigate_silhouette.svg"></div>

  <div class="card"><div class="big"><img src="/poc/corvette_silhouette.svg"></div>

  <div class="card"><div class="big"><img src="/poc/replenishment_silhouette.svg"></div>
    <div class="px"><img src="/poc/replenishment_silhouette.svg"></div>
    <div class="cap">综合补给舰<br><span style="color:#667">replenishment</span></div></div>
  <div class="card"><div class="big"><img src="/poc/fighter_silhouette.svg"></div>
    <div class="px"><img src="/poc/fighter_silhouette.svg"></div>
    <div class="cap">战斗机<br><span style="color:#667">fighter</span></div></div>
  <div class="card"><div class="big"><img src="/poc/aew_silhouette.svg"></div>
    <div class="px"><img src="/poc/aew_silhouette.svg"></div>
    <div class="cap">预警机<br><span style="color:#667">aew</span></div></div>
  <div class="card"><div class="big"><img src="/poc/armor_silhouette.svg"></div>
    <div class="px"><img src="/poc/armor_silhouette.svg"></div>
    <div class="cap">主战坦克<br><span style="color:#667">armor</span></div></div>
  <div class="card"><div class="big"><img src="/poc/artillery_silhouette.svg"></div>
    <div class="px"><img src="/poc/artillery_silhouette.svg"></div>
    <div class="cap">自行火炮<br><span style="color:#667">artillery</span></div></div>
  <div class="card"><div class="big"><img src="/poc/coastal_missile_silhouette.svg"></div>
    <div class="px"><img src="/poc/coastal_missile_silhouette.svg"></div>

  <div class="card"><div class="big"><img src="/poc/sam_battalion_silhouette.svg"></div>
    <div class="px"><img src="/poc/sam_battalion_silhouette.svg"></div>
    <div class="cap">防空发射车<br><span style="color:#667">sam_battalion</span></div></div>
 </div>
 <div class="row2">
   <div class="card dark"><div class="big"><img src="/assets/symbols/destroyer_red.svg"></div>
     <div class="px"><img src="/assets/symbols/destroyer_red.svg"></div>
     <div class="cap">现有（驱逐舰）<br>2525 帧形 + 图标</div></div>
   <div class="card dark"><div class="big"><img src="/poc/destroyer_silhouette.svg"></div>
     <div class="px"><img src="/poc/destroyer_silhouette.svg"></div>
     <div class="cap">剪影（驱逐舰）<br>不套帧</div></div>
 </div>
</div></body></html>
