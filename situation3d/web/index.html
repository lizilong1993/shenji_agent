<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>三维战场态势生成系统</title>
  <link rel="stylesheet" href="./vendor/cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>三维战场态势生成系统</strong>
      <span class="brand-sub" id="scenarioName">加载中…</span>
    </div>

    <nav class="topbar-actions">
      <div class="menu">
        <button id="menuCase" type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false">
          态势案例 <span class="caret">▾</span>
        </button>
        <div id="menuCaseList" class="menu-list" role="menu"></div>
      </div>

      <!-- 态势三件套直接挂在顶栏，不再套二级下拉：它们各自只有一个动作，
           多一层展开反而慢。仍复用 [data-situation-cmd] 委托与 SituationPanel.open()。 -->
      <button type="button" class="menu-btn" data-situation-cmd="input"
              title="框选或输入经纬度确定战场范围，添加目标与图层后生成双方态势">态势注册</button>
      <button type="button" class="menu-btn" data-situation-cmd="manage"
              title="查看与编辑当前态势：战场范围、目标编成、图层">态势管理</button>
      <button type="button" class="menu-btn" data-situation-cmd="download"
              title="导出当前帧 / 全帧 CSV / 态势定义">态势下载</button>

      <button id="btnRun" type="button" class="primary">态势自动推演</button>
    </nav>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">初始化中</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel panel-left">
      <!-- 图层管理独立滚动：它内容最长（四大类 + 说明文字），小屏上会把下面的
           目标列表挤出可视区。整列滚动会让目标列表跟着一起滚，所以这里只让
           图层管理这一块滚，目标列表固定在下方。 -->
      <!-- 图层管理现在独占左栏（目标列表已移除），不再需要"只让这一块滚动"的妥协，
           整列即它的滚动区。 -->
      <div class="layer-groups">
      <!-- 顶栏的「图层管理」下拉已移除，批量操作就近放在这里，功能不丢。 -->
      <div class="layer-cmds">
        <button type="button" class="mini" data-layer-cmd="show" title="打开四大类下所有开关（目标跟随除外）">全部显示</button>
        <button type="button" class="mini" data-layer-cmd="hide" title="关闭四大类下所有开关（底图与地图组件保留）">全部隐藏</button>
        <button type="button" class="mini" data-layer-cmd="default" title="回到首次打开时的图层状态">恢复默认</button>
      </div>
      <details class="layer-group panel-block" open>
        <summary>态势图层</summary>
        <label class="check"><input type="checkbox" id="layerHotspots" checked> 热点区域</label>
        <label class="check"><input type="checkbox" id="layerRoutes" checked> 计划航路</label>
        <label class="check"><input type="checkbox" id="layerLevelBanner" checked> 区域级态势横幅</label>
        <label class="check"><input type="checkbox" id="layerOverview" checked> 鸟瞰图</label>
      </details>

      <details class="layer-group panel-block" open>
        <summary>目标图层</summary>
        <label class="check"><input type="checkbox" id="layerTargets" checked> 可见目标</label>
        <label class="check"><input type="checkbox" id="layerLabels" checked> 目标标牌</label>
        <label class="check"><input type="checkbox" id="layerTracks" checked> 历史轨迹</label>
        <label class="check"><input type="checkbox" id="modelSensor"> 传感器覆盖</label>
        <label class="check"><input type="checkbox" id="layerTargetPanel" checked> 目标元数据面板</label>
        <div class="domain-row">
          <label class="check red"><input type="checkbox" id="filterRed" checked> 红方 <b id="countRed">0</b></label>
          <label class="check blue"><input type="checkbox" id="filterBlue" checked> 蓝方 <b id="countBlue">0</b></label>
          <label class="check"><input type="checkbox" id="filterSea" checked> 海上 <b id="countSea">0</b></label>
          <label class="check"><input type="checkbox" id="filterLand" checked> 陆上 <b id="countLand">0</b></label>
          <label class="check"><input type="checkbox" id="filterAir" checked> 空中 <b id="countAir">0</b></label>
        </div>
        <label class="check"><input type="checkbox" id="followTarget"> 目标跟随</label>
      </details>

      <details class="layer-group panel-block" open>
        <summary>底图</summary>
        <label class="check"><input type="checkbox" id="modelTianditu" checked> 天地图（在线影像+注记）</label>
        <label class="check"><input type="checkbox" id="modelTiandituLabel" checked> 天地图注记（保证不被影像盖住）</label>
        <!-- 在线底图状态。只说通/不通与原因，不讲操作方法（操作方法在用户手册里）。 -->
        <div class="switch-note" id="tdtNote"></div>
        <!-- 离线影像**默认开**：它垫在天地图下面（layerRegistry z=5 < 10）。
             两者不再互斥——天地图没有瓦片的地方（离线、key 失效、瓦片在途）露出的是
             离线影像，而不是球体底色。 -->
        <label class="check"><input type="checkbox" id="modelImagery" checked> 影像底图（离线，垫底兜底）</label>
        <label class="check"><input type="checkbox" id="modelHotspotImagery" checked> 热点区域高清影像</label>
        <label class="check"><input type="checkbox" id="modelUrbanImagery" checked> 城区高清影像（米级）</label>
        <label class="check"><input type="checkbox" id="modelTerrain"> 地形模型（DEM 高程）</label>
        <label class="check"><input type="checkbox" id="modelWsf3dOverlay"> 建筑高度图层（WSF3D）</label>
        <label class="check"><input type="checkbox" id="modelBuildingsOnline" checked> 在线三维实景建筑（Google 3D Tiles）</label>
        <label class="check"><input type="checkbox" id="modelBuildings"> 建筑体块（三维，本机离线）</label>
        <details class="layer-sub">
          <summary>Cesium ion 令牌（在线三维实景用）</summary>
          <label class="check" for="ionTokenInput">令牌</label>
          <input type="password" id="ionTokenInput" class="token-input"
                 placeholder="粘贴 Cesium ion access token" autocomplete="off" spellcheck="false">
          <button type="button" id="ionTokenSave" class="mini">保存令牌</button>
          <div class="switch-note" id="ionTokenNote">未配置。</div>
        </details>
        <label class="check"><input type="checkbox" id="modelPlaces" checked> 地名</label>
        <label class="check"><input type="checkbox" id="modelWeather"> 气象模型</label>
      </details>

      <details class="layer-group panel-block" open>
        <summary>地图组件</summary>
        <label class="check"><input type="checkbox" id="compCompass" checked> 指南针</label>
        <label class="check"><input type="checkbox" id="compScalebar" checked> 比例尺</label>
        <label class="check"><input type="checkbox" id="compViewpoint" checked> 视点坐标</label>
      </details>

      </div>
    </aside>

    <section class="globe-wrap">
      <div id="cesiumContainer"></div>

      <!-- 目标信息面板已移除：内容并入右栏「目标态势栏」，同时把右上角让给鸟瞰图。 -->

      <div id="levelBanner" class="level-banner">
        <span class="lb-label">区域级态势</span>
        <span class="lb-value" id="levelValue">—</span>
        <span class="lb-intent" id="levelIntent">—</span>
        <span class="lb-phase" id="levelPhase">—</span>
        <span class="lb-note" id="levelNote"></span>
      </div>

      <div id="legend" class="legend">
        <span><i class="swatch red"></i>红方</span>
        <span><i class="swatch blue"></i>蓝方</span>
        <span><i class="swatch line"></i>航迹</span>
        <span><i class="swatch hotspot"></i>热点区域</span>
      </div>

      <div id="loadingBadge" class="loading-badge hidden">
        <span class="lb-spinner"></span><span id="loadingText">正在加载瓦片…</span>
      </div>

      <!-- 鸟瞰图：第二个 Cesium 2D 视图，显示真实地球缩略图并与主相机联动 -->
      <div id="overviewWrap" class="overview-wrap hidden">
        <div class="ov-head">
          <span class="ov-title">鸟瞰图 · 与主图同视点</span>
          <button id="ovHide" type="button" class="ov-btn" aria-label="隐藏">×</button>
        </div>
        <div id="overviewContainer" class="ov-canvas"></div>
      </div>

      <!-- 地图组件：Cesium 1.145 无内置指南针与比例尺，三项均为自建。
           角位：鸟瞰图右上、指南针其下、复位视角再下、比例尺左下、视点底部居中。 -->
      <div id="mapCompass" class="map-comp" title="点击复位正北（相机航向归零）">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.92)" stroke="#b9c6d8"/>
          <g id="compRose">
            <line x1="50" y1="12" x2="50" y2="88" stroke="#c9d2de" stroke-width="1"/>
            <line x1="12" y1="50" x2="88" y2="50" stroke="#c9d2de" stroke-width="1"/>
            <path d="M50 8 L55 20 L45 20 Z" fill="#c8352c"/>
            <path d="M50 92 L55 80 L45 80 Z" fill="#8a94a6"/>
            <text x="50" y="31" text-anchor="middle" font-size="15" fill="#c8352c">N</text>
            <text x="50" y="80" text-anchor="middle" font-size="12" fill="#6b7688">S</text>
            <text x="81" y="55" text-anchor="middle" font-size="12" fill="#6b7688">E</text>
            <text x="19" y="55" text-anchor="middle" font-size="12" fill="#6b7688">W</text>
            <circle cx="50" cy="50" r="2.5" fill="#4c5866"/>
          </g>
          <path d="M50 1 L56 13 L44 13 Z" fill="#1668dc"/>
        </svg>
      </div>

      <!-- 顶栏「视图」菜单已移除，复位视角就近放在指南针下方；保留原 id，
           app.js 里的绑定不变。 -->
      <button id="btnLocate" type="button" class="map-locate"
              title="回到案例默认机位，并解除热点锁定与目标跟随">复位视角</button>

      <div id="mapViewpoint" class="map-viewpoint">
        <span>视点经纬高：</span><b id="mvAll">—</b>
      </div>

      <div id="mapScalebar" class="map-scalebar">
        <div class="sb-track"><div id="sbBar" class="sb-bar"></div></div>
        <span id="sbLabel">—</span>
      </div>

      <!-- 界面不写操作说明：操作方法见用户手册。 -->
    </section>

    <aside class="panel panel-right">
      <!-- 整体态势栏：全局各类型、各方目标的整体状态（图标 + 告警等级着色）。
           展示案例完整编成，不跟随地图上的红/蓝/域过滤开关。 -->
      <section class="panel-block">
        <h2>整体态势</h2>
        <div id="overallBody" class="os-body">未加载态势</div>
      </section>

      <!-- 目标意图：选中目标后只显示它的**意图集合**（CES 候选集合）及其判据。
           状态/活动规律/装备参数等已按要求移除——这一栏回答的是"这个目标想干什么"，
           别的读数会把它淹掉。 -->
      <section class="panel-block">
        <h2>目标意图</h2>
        <div id="targetBody" class="ts-body">
          <div class="ts-empty">未选择目标</div>
        </div>
      </section>

      <!-- 区域态势栏：光标所在区域 + 区域级态势 + 热点区域列表。
           原先分散在「光标位置信息」与「热点区域」两块，现在同属一栏。 -->
      <section class="panel-block">
        <h2>区域态势</h2>
        <!-- 只显示**整个案例范围**的整体态势：不再逐热点罗列，也不再随光标显示
             单个区域的态势——那两者都是"局部"，与"区域态势"这一栏要回答的问题
             （这一仗整体打到什么程度）不是一回事。 -->
        <div class="kv"><span>范围</span><b id="geoSpan">—</b></div>
        <div class="region-level">
          <span class="rl-value" id="rlValue">—</span>
          <span class="rl-intent" id="rlIntent">—</span>
          <span class="rl-phase" id="rlPhase">—</span>
        </div>
        <div class="region-note" id="rlNote"></div>
      </section>
    </aside>
  </main>

  <footer class="transport">
    <div class="transport-left">
      <!-- 播放控制在前进/后退**左边**：时间轴是主轴，播放/复位/倍速是它的操作。 -->
      <button id="btnPlay" type="button" class="mini">▶ 播放</button>
      <button id="btnReset" type="button" class="mini">⟲ 复位</button>
      <label class="tr-speed">倍速
        <select id="speedSelect">
          <option value="1">1×</option>
          <option value="10">10×</option>
          <option value="30" selected>30×</option>
          <option value="60">60×</option>
          <option value="120">120×</option>
        </select>
      </label>
      <span class="tr-sep"></span>
      <button id="btnStepBack" type="button">◀</button>
      <button id="btnStepFwd" type="button">▶</button>
      <span id="tickLabel">0 / 0</span>
    </div>
    <input id="timeline" type="range" min="0" max="0" value="0" step="1">
    <div class="transport-right">
      <span id="clockLabel">—</span>
    </div>
  </footer>

  <!-- 态势输入 / 管理 / 数据下载：三标签页模态框 -->
  <div id="situationModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="态势">
    <div class="modal-panel">
      <div class="modal-head">
        <div class="modal-tabs" id="sitTabs">
          <button type="button" class="modal-tab" data-sit-tab="input">态势输入</button>
          <button type="button" class="modal-tab" data-sit-tab="manage">态势管理</button>
          <button type="button" class="modal-tab" data-sit-tab="brief">态势简报</button>
          <button type="button" class="modal-tab" data-sit-tab="download">态势数据下载</button>
        </div>
        <button id="sitClose" type="button" class="modal-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="sitBody"></div>
    </div>
  </div>

  <script src="./vendor/cesium/Cesium.js"></script>
  <script src="./src/tilecache.js"></script>
  <script src="./src/symbology.js"></script>
  <script src="./src/assets.js"></script>
  <script src="./src/layerRegistry.js"></script>
  <script src="./src/renderGovernor.js"></script>
  <script src="./src/dataHealth.js"></script>
  <script src="./src/sceneDoc.js"></script>
  <script src="./src/intentUi.js"></script>
  <script src="./src/statusPanels.js"></script>
  <script src="./src/buildings3d.js"></script>
  <script src="./src/overview.js"></script>
  <script src="./src/places.js"></script>
  <script src="./src/situation.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
